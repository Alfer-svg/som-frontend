# SOM App Android — gera o APK do casco Capacitor (mesmo app do iOS).
# O APK sai como asset público na release "android" (link estável pra instalar
# direto no aparelho, sem Play Store). Build de debug: assinado com keystore de
# debug, suficiente pra sideload; quando formos à Play Store, trocamos por
# assinatura de release + AAB.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write # publicar o APK na release "android"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências e sincronizar Capacitor
        run: |
          npm ci || npm install
          npx cap sync android

      - name: Compilar APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Maracatu.apk

      - name: Publicar na release "android" (link estável)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: App Android (APK)
          body: |
            APK do app Maracatu (Área do Cliente) para instalar direto no Android,
            sem Play Store: baixe o Maracatu.apk no aparelho, toque nele e autorize
            "instalar de fontes desconhecidas" quando o Android pedir.
          files: Maracatu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Maracatu-apk
          path: Maracatu.apk

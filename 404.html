<!--
  O GitHub Pages serve ESTE arquivo para qualquer caminho que não exista mais no
  repositório. Como o sistema inteiro saiu daqui, é ele que atende /cliente.html,
  /candidato.html, /proposta.html e tudo o mais — e manda cada um para o mesmo
  caminho no endereço novo, preservando parâmetros (?token=...) e âncora.

  É por isso que os links de portal já enviados e o app já instalado continuam
  funcionando mesmo com o sistema fora daqui.
-->
<script>
  // O Pages publica em /som-frontend/ — tira esse prefixo antes de repassar.
  var caminho = location.pathname.replace(/^\/som-frontend/, '');
  location.replace('https://app.maracatumktdigital.com' + caminho + location.search + location.hash);
</script>

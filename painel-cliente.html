<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Painel · Maracatu</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  /* ── mesmo design system do painel do candidato ── */
  :root{
    --bg:#F6F7F9; --card:#fff; --paper:#fff; --ink:#202124; --ink2:#3c4043; --mut:#5F6368; --mut2:#9AA0A6;
    --line:#E8EAED; --hair:#EEF0F2;
    --blue:#4285F4; --bluebg:#E8F0FE; --blsoft:#F4F8FE;
    --grn:#34A853; --grnbg:#E6F4EA; --grnink:#1E8E4E; --grnsoft:#F3FAF6;
    --amb:#B06000; --amb2:#F9A825; --ambbg:#FEF7E0; --ambsoft:#FEFBEF;
    --red:#EA4335; --redbg:#FCE8E6; --redsoft:#FEF6F4; --yellow:#F9A825;
    --up:#1E8E4E; --down:#dc2626;
    --shadow:0 2px 10px rgba(60,64,67,.08); --shadow-sm:0 1px 2px rgba(60,64,67,.06); --r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:radial-gradient(900px 500px at 100% -6%, rgba(66,133,244,.05), transparent 55%),radial-gradient(800px 420px at 4% 104%, rgba(52,168,83,.05), transparent 55%), var(--bg);
    color:var(--ink);font-family:Roboto,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55;font-size:14px}
  .num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  a{color:inherit}

  /* faixa fina das 4 cores no topo dos cartões — assinatura (igual candidato) */
  .band4{position:absolute;top:0;left:0;right:0;height:5px;border-radius:var(--r) var(--r) 0 0;
    background:linear-gradient(90deg,var(--blue) 0 25%,var(--red) 25% 50%,var(--amb2) 50% 75%,var(--grn) 75% 100%)}

  .wrap{max-width:900px;margin:0 auto;padding:0 clamp(12px,3vw,20px) 60px}
  .estado{max-width:520px;margin:90px auto;text-align:center;color:var(--mut);padding:0 20px}
  .estado b{color:var(--ink);display:block;font-size:18px;margin-bottom:8px}
  .spin{width:34px;height:34px;border:3px solid var(--hair);border-top-color:var(--ink);border-radius:50%;margin:0 auto 18px;animation:g .9s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}

  /* marca da Maracatu (letterhead) no topo do painel */
  .brandbar{display:flex;align-items:center;gap:12px;padding:22px 2px 0}
  .brandbar img{height:30px;width:auto;display:block}
  .bb-actions{margin-left:auto;display:flex;align-items:center;gap:12px}
  .brandbar .lbl{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mut2)}
  .btn-print{display:inline-flex;align-items:center;gap:7px;border:0;cursor:pointer;background:var(--ink);color:#fff;font:600 12.5px Roboto,system-ui,sans-serif;padding:9px 15px;border-radius:11px;box-shadow:var(--shadow-sm);transition:opacity .15s}
  .btn-print:hover{opacity:.88}
  .btn-print svg{display:block}
  /* modificador do botão secundário: era ".sec", que colidia com a classe das
     SEÇÕES (.sec{margin-top:32px}) e empurrava os botões 32px pra baixo. */
  .btn-print.claro{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .bb-back{margin-left:12px}
  @media (max-width:520px){ .brandbar .lbl{display:none} }
  /* ───── MENU DO TOPO no celular (Dinho 07/08) ─────
     A barra era uma linha só de flex sem wrap: logo + 3 botões estouravam a
     largura e o "Voltar" ficava cortado fora da tela. No celular ela vira duas
     linhas organizadas — 1ª: marca à esquerda e Voltar à direita (navegação);
     2ª: os dois botões de relatório dividindo a largura. */
  @media (max-width:640px){
    .brandbar{flex-wrap:wrap;row-gap:10px;gap:8px;padding-top:16px}
    .brandbar img{height:24px}
    .brandbar .lbl{display:none}
    .bb-back{order:1;margin-left:auto}
    .bb-actions{order:2;width:100%;margin-left:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .bb-actions .btn-print{width:100%;justify-content:center;white-space:nowrap;padding:10px 8px;font-size:11.5px}
  }
  /* impressão / salvar como PDF — some com o que é interativo, cartões não quebram no meio */
  @page{margin:10mm 12mm}
  @page :first{margin:0} /* capa em sangria total */
  /* ── CAPA do relatório (só na impressão) — arte oficial Maracatu ── */
  #capa{display:none}
  #capa .cp-logo{position:absolute;left:8%;top:9%;width:31%}
  #capa .cp-title{position:absolute;left:8%;top:38%;font-size:34pt;line-height:1.12;letter-spacing:-.01em;color:#141414;font-weight:300}
  #capa .cp-title b{font-weight:800}
  #capa .cp-bar{position:absolute;left:8%;top:52.5%;width:31%;height:5px;display:flex}
  #capa .cp-bar i{flex:1}
  #capa .cp-bar i:nth-child(1){background:#EA4335}
  #capa .cp-bar i:nth-child(2){background:#F9A825}
  #capa .cp-bar i:nth-child(3){background:#4285F4}
  #capa .cp-bar i:nth-child(4){background:#34A853}
  #capa .cp-per{position:absolute;left:8%;top:56.5%;font-size:14pt;font-weight:600;letter-spacing:.42em;color:#141414;white-space:nowrap}
  #capa .cp-cli{position:absolute;left:8%;bottom:10%;width:40%;display:flex;align-items:center;gap:12px;font-size:11pt;color:#3c4043;border-bottom:1px solid #D9D6CF;padding-bottom:14px}
  #capa .cp-cli .ico{width:38px;height:38px;border-radius:50%;border:1.5px solid #B9B5AC;display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
  /* lateral direita = recorte da arte oficial (foto + cortes + formas), aspecto idêntico ao A4 */
  #capa .cp-lado{position:absolute;top:0;right:0;height:100%;width:auto}
  @media print{
    #capa{display:block;position:relative;width:100%;height:99vh;background:#f8f8f8;overflow:hidden;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    #capa *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    /* itens desmarcados ("cliente vê" desligado) NÃO saem no relatório impresso */
    .blk.off-eq,.cxw.off-eq{display:none!important}
    /* seção cujos blocos estão todos desmarcados some inteira (cabeçalho junto) */
    .sec:has(.blk):not(:has(.blk:not(.off-eq))){display:none!important}
    body{background:#fff}
    .no-print{display:none!important}
    .top .per{display:none!important}
    .brandbar{padding-top:0}
    .wrap{max-width:none;padding:0 0 10px}
    .card,.top,.hero,.sec,.fmt,.post{box-shadow:none!important;break-inside:avoid;page-break-inside:avoid}
    #mapaCli{break-inside:avoid}
  }
  /* topo — cartão de cabeçalho igual candidato */
  .top{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-top:14px}
  .top .ava{width:60px;height:60px;border-radius:16px;flex:none;display:grid;place-items:center;font-weight:700;font-size:19px;color:#fff;overflow:hidden;background:linear-gradient(135deg,var(--blue),#6FA8FF);box-shadow:0 8px 20px -8px rgba(66,133,244,.5)}
  .top .ava img{width:100%;height:100%;object-fit:cover}
  /* COM LOGO (Dinho 07/08): fundo branco, marca INTEIRA e maior no PC — o cover
     sobre o gradiente azul cortava a arte e virava um quadradinho ilegível. */
  .top .ava.tem-logo{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);padding:5px}
  .top .ava.tem-logo img{object-fit:contain}
  @media (min-width:900px){ .top .ava{width:88px;height:88px;border-radius:22px} }
  .top .nm{font-size:clamp(18px,2.4vw,23px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .top .pe{font-size:12px;color:var(--mut);margin-top:2px}
  .top .per{margin-left:auto;display:flex;flex-wrap:wrap;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
  /* período personalizado: calendário de/até */
  .custom-per{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--mut);box-shadow:var(--shadow-sm)}
  .custom-per input[type=date]{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
  .custom-per .btn-apl{border:0;cursor:pointer;background:var(--ink);color:#fff;font:600 12px Roboto,system-ui,sans-serif;padding:8px 14px;border-radius:9px}
  .custom-per .btn-apl:hover{opacity:.88}
  .chip{border:0;background:transparent;color:var(--mut);font:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:.15s}
  .chip.on{background:var(--blue);color:#fff;box-shadow:0 5px 14px -6px rgba(66,133,244,.6)}
  .chip:not(.on):hover{color:var(--ink)}

  /* leitura do dia — estilo .ia do candidato (branco→azul suave, sem bloco preto) */
  .hero{background:linear-gradient(180deg,#fff,var(--blsoft));border:1px solid var(--line);border-radius:var(--r);padding:20px 22px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden;margin-top:15px}
  .hero .k{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-top:4px}
  .hero h1{font-size:clamp(17px,2.2vw,21px);font-weight:700;letter-spacing:-.02em;margin:8px 0 7px;line-height:1.15;color:var(--ink);max-width:66ch}
  .hero p{font-size:13.5px;line-height:1.6;color:var(--ink2);max-width:82ch}

  /* seções */
  .sec{margin-top:32px}
  .sec-h{display:flex;align-items:center;gap:10px;margin-bottom:15px}
  .sec-h .ic{width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center}
  .sec-h h2{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0}
  .sec-h .sub{font-size:12px;color:var(--mut2);margin-left:auto}

  /* KPIs — tiles do candidato: fundo levíssimo por cor, número escuro */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
  .kpi{border-radius:var(--r);padding:16px;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
  .kpi .lb{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
  .kpi .vl{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1;margin-top:8px;color:var(--ink)}
  .kpi .dl{font-size:12px;font-weight:700;margin-top:7px;display:inline-flex;align-items:center;gap:4px}
  .kpi.b{background:var(--blsoft)} .kpi.g{background:var(--grnsoft)} .kpi.a{background:var(--ambsoft)} .kpi.r{background:var(--redsoft)}
  .up{color:var(--up)} .down{color:var(--down)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow-sm);position:relative}
  .card+.card{margin-top:15px}
  h3{font-size:13px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink);margin:0 0 14px;display:flex;align-items:center;gap:8px}
  h3::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue);flex:none}

  /* barras interações */
  .ibar{display:flex;flex-direction:column;gap:13px}
  .ir{display:grid;grid-template-columns:130px 1fr auto;align-items:center;gap:12px}
  .ir .l{font-size:13px;font-weight:600;color:var(--ink)}
  .ir .t{height:10px;background:var(--hair);border-radius:99px;overflow:hidden;display:block}
  .ir .f{height:100%;border-radius:99px;display:block}
  .ir .v{font-weight:800;font-variant-numeric:tabular-nums;font-size:13.5px}

  /* formatos */
  .fmts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .fmt{border-radius:13px;padding:15px;border:1px solid var(--line)}
  .fmt .top{padding:0;display:block}
  .fmt .tag{display:inline-block;font-size:11px;font-weight:800;color:#fff;padding:4px 10px;border-radius:99px;margin-bottom:12px}
  .fmt .big{font-size:20px;font-weight:800;letter-spacing:-.01em}
  .fmt .big small{font-size:12px;font-weight:600;color:var(--mut)}
  .fmt ul{list-style:none;margin:12px 0 0;padding:0;font-size:12.5px;color:var(--ink2)}
  .fmt li{display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid var(--hair)}
  .fmt li b{font-weight:700}

  /* top posts */
  .posts{display:flex;flex-direction:column;gap:10px}
  .post{display:flex;gap:13px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:12px}
  .post .rk{width:26px;flex:none;font-weight:800;color:var(--mut2);font-size:15px;text-align:center}
  .post .th{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:#eee}
  .post .mid{flex:1;min-width:0}
  .post .tp{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--blue)}
  .post .tx{font-size:12.5px;color:var(--ink2);line-height:1.35;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .post .met{font-size:11.5px;color:var(--mut);margin-top:3px}
  .post .eng{flex:none;text-align:right}
  .post .eng b{font-size:17px;font-weight:800;color:var(--grnink)}
  .post .eng span{display:block;font-size:9.5px;color:var(--mut2);text-transform:uppercase;letter-spacing:.05em;font-weight:700}

  /* direcionamentos */
  .dir{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--hair)}
  .dir:first-child{border-top:0;padding-top:0}
  .dir .n{width:24px;height:24px;border-radius:50%;flex:none;background:var(--grnbg);color:var(--grnink);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .dir b{font-size:13.5px;display:block;margin-bottom:2px}
  .dir p{font-size:12.5px;color:var(--ink2);line-height:1.5;margin:0}

  /* mídia tiles */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .tl{background:var(--bg);border-radius:11px;padding:13px 14px}
  .tl .lb{font-size:11px;font-weight:600;color:var(--mut);margin-bottom:6px}
  .tl .vl{font-size:20px;font-weight:800;letter-spacing:-.02em}

  /* tabela — .tw é a caixa que rola de lado quando a tabela não cabe (celular) */
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
  .tw::-webkit-scrollbar{height:6px}
  .tw::-webkit-scrollbar-thumb{background:#d6d3cc;border-radius:3px}
  /* LISTA DAS "OUTRAS CIDADES" (Dinho 07/08): agrupar era necessário pra tabela
     não virar 364 linhas, mas o nome de cada uma continua disponível — aparece
     ao passar o mouse (ou tocar) na linha agregada.
     ⚠️ a caixinha é POSITION:FIXED e posicionada por JS: a tabela vive dentro do
     .tw (overflow-x:auto) e um popover absoluto ali dentro sairia cortado. */
  td.temlista{cursor:help}
  td.temlista .marca{font-size:10px;color:#9aa0a6}
  .cidlista{display:none;position:fixed;z-index:60;min-width:290px;max-width:360px;max-height:280px;
    overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;
    box-shadow:0 12px 34px -10px rgba(0,0,0,.3);padding:9px 11px;font-size:11.5px;line-height:1.5;color:var(--ink)}
  .cidlista.on{display:block}
  .cidlista .cl{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--hair);padding:2px 0}
  .cidlista .cl:last-child{border-bottom:0}
  .cidlista .cl span:last-child{color:var(--mut);white-space:nowrap}
  .tw-hint{font-size:11px;color:var(--mut);margin-top:5px}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;margin-top:6px}
  th{text-align:left;font-size:10.5px;font-weight:700;color:var(--mut);background:#F3F1EC;padding:8px 10px}
  th.n{text-align:right}
  td{padding:8px 10px;border-bottom:1px solid var(--hair);color:var(--ink2)}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  td.k{color:var(--ink);font-weight:600}
  .adn{display:flex;align-items:center;gap:9px}
  .adn img{width:32px;height:32px;border-radius:6px;object-fit:cover;flex:none}

  .big3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .b3{border-radius:16px;padding:20px;background:#fff;border:1px solid var(--line)}
  .b3 .lb{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
  .b3 .vl{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
  .b3 .em{font-size:11.5px;color:var(--mut2);margin-top:7px}

  .mh{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:10px}
  /* nota "Leitura da equipe Maracatu" (IA) por bloco — estilo candidato */
  .nota-eq{margin-top:14px;padding:11px 14px;background:var(--blsoft);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:11px;font-size:13px;line-height:1.62;color:var(--ink2)}
  .nota-eq .lbl{display:block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
  .pie{display:flex;align-items:center;gap:16px}
  .pie svg{flex:none}
  .plg{display:flex;flex-direction:column;gap:8px;min-width:0}
  .pl{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .pl .dot{width:11px;height:11px;border-radius:3px;flex:none}
  .pl .pn{color:var(--ink);font-weight:600}
  .pl .pp{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink2)}
  /* gráfico de linha (evolução) + rótulo auxiliar das caixas novas — 07/08 */
  .graf{margin-top:10px}
  .graf svg{display:block;overflow:visible}
  .lg{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px}
  .lg-i{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-weight:600}
  .lg-i b{color:var(--ink);font-variant-numeric:tabular-nums}
  .lg-d{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
  .sub-graf{margin-top:14px}
  .sub-graf h3{font-size:13px;font-weight:700;color:var(--ink);margin:0 0 2px}
  .sub-l{font-size:12px;color:var(--mut);line-height:1.5;margin-top:6px}
  .tl .sub-l{font-size:10.5px;margin-top:3px}
  .mini{display:flex;flex-direction:column;gap:10px}
  .mr{display:grid;grid-template-columns:74px 1fr 40px;align-items:center;gap:10px}
  /* rótulos longos ("Acessibilidade", "Boas práticas") encostavam na barra */
  .mini.lbl-lg .mr{grid-template-columns:104px 1fr 40px}
  .mr .l{font-size:12.5px;font-weight:600;color:var(--ink)}
  .mr .t{height:10px;background:var(--hair);border-radius:99px;overflow:hidden;display:block}
  .mr .f{height:100%;border-radius:99px;display:block}
  .mr .v{font-weight:800;font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
  .legend{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:8px;font-size:11px;color:var(--mut)}
  .legend i{width:9px;height:9px;border-radius:2px;background:var(--yellow);display:inline-block}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .emcoleta{font-size:12.5px;color:var(--mut);background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center}
  #mapaCli{height:300px;border-radius:12px;overflow:hidden;border:1px solid var(--line);z-index:0}
  .leaflet-container{font:inherit}
  .map-leg{font-size:11.5px;color:var(--mut);margin-top:10px;display:flex;align-items:center;gap:6px}
  .map-leg i{width:11px;height:11px;border-radius:50%;background:rgba(66,133,244,.5);border:2px solid var(--blue);display:inline-block}
  .foot{margin-top:36px;text-align:center;font-size:11.5px;color:var(--mut2)}

  /* quadradinho "Cliente vê" por bloco — só na visão da equipe (mesmo padrão do candidato) */
  .blk+.blk{margin-top:14px}
  .blk.off-eq{opacity:.55}
  .blk-ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:7px;padding:7px 12px;border:1px dashed var(--line);border-radius:11px;background:var(--card)}
  .blk-ctl .selo{font-size:10px;font-weight:800;letter-spacing:.05em;padding:3px 8px;border-radius:99px}
  .blk-ctl label{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mut);cursor:pointer;user-select:none}
  .blk-ctl input{width:16px;height:16px;cursor:pointer;accent-color:var(--grn);margin:0}
  /* mini-quadradinho POR CAIXINHA (tile de métrica) — só na visão da equipe */
  .cxw{position:relative;display:flex}
  .cxw>div{flex:1;min-width:0}
  .cxw.off-eq{opacity:.5}
  .cx-chk{position:absolute;top:7px;right:8px;z-index:2;cursor:pointer;line-height:0}
  .cx-chk input{width:14px;height:14px;cursor:pointer;accent-color:var(--grn);margin:0}

  @media (max-width:720px){
    .kpis{grid-template-columns:1fr 1fr} .fmts{grid-template-columns:1fr} .tiles{grid-template-columns:1fr 1fr}
    .two{grid-template-columns:1fr} .big3{grid-template-columns:1fr}
    /* "Compartilhamentos" não cabia em 100px e ficava cortado por cima da barra */
    .ir{grid-template-columns:120px 1fr auto;gap:8px}
    .ir .l{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .top{flex-wrap:wrap} .top .per{margin-left:0;width:100%}
  }
  /* ── COMPACTAÇÃO da impressão (fica DEPOIS do bloco mobile pra vencer a cascata:
     a página impressa tem ~700px e caía nas regras de celular, empilhando os gráficos) ── */
  @media print{
    /* grades lado a lado como no desktop (pizzas Gênero × Dispositivo juntas) */
    .two{grid-template-columns:1fr 1fr;gap:10px}
    .kpis{grid-template-columns:repeat(4,1fr);gap:8px}
    .tiles{grid-template-columns:repeat(3,1fr);gap:8px}
    .big3{grid-template-columns:repeat(3,1fr);gap:8px}
    .fmts{grid-template-columns:repeat(3,1fr);gap:8px}
    /* cards grandes PODEM quebrar de página (evita páginas com buraco vazio);
       o que não pode partir no meio são as peças pequenas */
    .card,.sec{break-inside:auto;page-break-inside:auto}
    .kpi,.tl,.b3,.fmt,.post,.pie,.mini,.nota-eq,.dir,tr{break-inside:avoid;page-break-inside:avoid}
    /* gráfico nunca se separa do próprio título (Faixa etária órfã no pé da página) */
    .sub-graf,.two>div{break-inside:avoid;page-break-inside:avoid}
    /* título de tabela/gráfico não fica sozinho no fim da folha */
    .mh,h3,.sec-h{break-after:avoid;page-break-after:avoid}
    /* respiro menor entre blocos e dentro dos cartões */
    .wrap{padding:0}
    .sec{margin-top:14px}
    .sec-h{margin-bottom:8px}
    .blk+.blk{margin-top:8px}
    .card{padding:12px}
    .card+.card{margin-top:8px}
    .hero{padding:13px 16px 14px;margin-top:8px}
    .top{padding:12px;margin-top:8px;gap:10px}
    .nota-eq{margin-top:8px;padding:8px 12px}
    .posts{gap:6px}
    .ibar{gap:8px}
    h3{margin-bottom:9px}
    .mh{margin-bottom:6px}
    /* números um ponto menores = menos altura sem perder leitura */
    .kpi .vl{font-size:21px;margin-top:5px}
    .b3 .vl{font-size:21px}
    .b3{padding:13px}
    .tl{padding:9px 11px}
    .tl .vl{font-size:16px}
    table{font-size:11px}
    .tw{overflow:visible!important} /* no papel a tabela não pode ficar cortada */
    .tw-hint{display:none!important}
    td.temlista .cidlista{display:none!important}
    th,td{padding:5px 8px}
    #mapaCli{height:220px}
    .foot{margin-top:14px}
  }
</style>

<body>
<!-- CAPA (aparece só na impressão, como 1ª página do relatório) -->
<div id="capa" aria-hidden="true">
  <img class="cp-logo" src="assets/logo-horizontal.png?v=7" alt="Maracatu Digital">
  <div class="cp-title">RELATÓRIO DE<br><b>CAMPANHAS</b></div>
  <div class="cp-bar"><i></i><i></i><i></i><i></i></div>

  <div class="cp-cli"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 19c1.2-3.1 3.7-4.6 6.5-4.6s5.3 1.5 6.5 4.6"/></svg></span><span><b>Cliente:</b> <span id="capaCli"></span></span></div>
</div>
<div id="app"><div class="estado"><div class="spin"></div><b>Abrindo seu painel…</b>Puxando seus números do Instagram e das campanhas. Leva alguns segundos.</div></div>

<script>
(function(){
  'use strict';
  var API='https://som-backend-production-01d8.up.railway.app/api';
  var app=document.getElementById('app');
  var qs=new URLSearchParams(location.search);
  var adminCli=qs.get('cliente'), somTok=localStorage.getItem('som_token');
  var cliTok=localStorage.getItem('cliente_token')||'';
  var mapaPts=null;
  var LISTAS={};   // html das listas de cidades agrupadas, por id da linha

  var modo = (adminCli&&somTok)?'admin':'cliente';

  function fInt(n){return Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:0});}
  function fNum(n){var v=Number(n||0);return v.toLocaleString('pt-BR',{minimumFractionDigits:(v%1?1:0),maximumFractionDigits:1});}
  function fMil(n){n=Number(n||0);if(n>=1000)return (n/1000).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' mil';return fInt(n);}
  function fMoney(n){return 'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function fPct(n){return n==null?'—':Number(n).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function ini2(s){s=String(s||'').trim();var p=s.split(/\s+/);return ((p[0]||'')[0]||'')+((p[1]||'')[0]||'');}
  // Nota "Leitura da equipe Maracatu" por bloco (IA) — estilo candidato. Vazio = não mostra.
  function notaEquipe(txt){ txt=String(txt||'').trim(); return txt ? '<div class="nota-eq"><span class="lbl">Leitura da equipe Maracatu</span>'+esc(txt)+'</div>' : ''; }
  function estado(h){app.innerHTML='<div class="estado">'+h+'</div>';}

  // selo de variação — pro CLIENTE, só aparece quando é ALTA (▲ verde). Queda não aparece.
  function delta(v, sufixo, pp){
    if(v==null || v<=0) return '';
    var val=(pp? '+'+fNum(v)+' p.p.' : '+'+fNum(v)+'%');
    return '<span class="dl up">▲ '+val+(sufixo?' '+sufixo:'')+'</span>';
  }
  function deltaAbs(v){ if(v==null || v<=0) return ''; return '<span class="dl up">▲ +'+fInt(v)+'</span>'; }

  // gráfico SVG barras amarelas (imprime e renderiza sempre)
  function chartSVG(itens, leg){
    itens=(itens||[]).filter(function(x){return x.valor>0;});
    if(!itens.length)return '';
    var max=0;itens.forEach(function(x){if(x.valor>max)max=x.valor;});
    var step=Math.pow(10,Math.floor(Math.log10(max||1)));var topo=Math.ceil(max/step)*step;if(topo<=max)topo+=step;
    var W=340,H=160,padB=24,padT=6,padL=6,plotH=H-padB-padT,plotW=W-padL-6,n=itens.length,slot=plotW/n,bw=Math.min(30,slot*0.56);
    var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">';
    for(var k=0;k<=4;k++){var gy=padT+plotH*(k/4);s+='<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-6)+'" y2="'+gy.toFixed(1)+'" stroke="#EAE6DC" stroke-width="1" stroke-dasharray="3 3"/>';}
    itens.forEach(function(x,i){var bh=Math.max(2,x.valor/topo*plotH),cx=padL+slot*i+slot/2,by=padT+plotH-bh;
      s+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="#F4B400"/>';
      s+='<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="8.5" fill="#6c7480">'+esc(x.label)+'</text>';});
    s+='</svg>';
    return '<div>'+s+'<div class="legend"><i></i> '+esc(leg||'')+'</div></div>';
  }

  // barras horizontais com % (gênero, dispositivo). cores = mapa label→hex
  function mini(itens, cores){
    itens=(itens||[]).filter(function(x){return x.valor>0;});
    if(!itens.length)return '';
    var tot=itens.reduce(function(s,x){return s+x.valor;},0)||1;
    return '<div class="mini">'+itens.map(function(x){
      var pct=Math.round(x.valor/tot*100), cor=(cores&&cores[x.label])||'#6c7480';
      return '<div class="mr"><span class="l">'+esc(x.label)+'</span>'+
        '<span class="t"><span class="f" style="width:'+Math.max(3,pct)+'%;background:'+cor+'"></span></span>'+
        '<span class="v num">'+pct+'%</span></div>';
    }).join('')+'</div>';
  }

  // LINHA (SVG) — evolução no tempo. series=[{nome,cor,campo}], pts=[{data,...}].
  // Eixo Y por série (escalas diferentes convivem: alcance na casa dos milhares e
  // engajamento em %), então cada linha é normalizada pelo próprio máximo e a
  // legenda mostra o valor REAL do último ponto — sem eixo mentiroso.
  function linha(pts, series, alt, escalaComum){
    pts=(pts||[]).filter(function(p){return p&&p.data;});
    if(pts.length<2) return '';
    var W=760, H=alt||190, padL=8, padR=8, padT=14, padB=26;
    var plotW=W-padL-padR, plotH=H-padT-padB;
    var usadas=series.filter(function(s){ return pts.some(function(p){ return p[s.campo]!=null && !isNaN(p[s.campo]); }); });
    if(!usadas.length) return '';
    // X proporcional à DATA (não ao índice): as séries têm dias faltando, e
    // espaçar por índice faria 9 dias sem dado parecerem 1 (tempo distorcido).
    var t0=new Date(pts[0].data+'T12:00:00').getTime();
    var t1=new Date(pts[pts.length-1].data+'T12:00:00').getTime();
    var span=(t1-t0)||1;
    // escalaComum: séries de MESMA unidade (R$ com R$, contatos com contatos)
    // dividem o mesmo máximo — só assim a comparação entre elas é honesta.
    var maxComum=1;
    if(escalaComum){
      usadas.forEach(function(s){ pts.forEach(function(p){ var v=p[s.campo]; if(v!=null&&Number(v)>maxComum) maxComum=Number(v); }); });
    }
    var paths=usadas.map(function(s){
      var vals=pts.map(function(p){ return p[s.campo]==null?null:Number(p[s.campo]); });
      var ok=vals.filter(function(v){return v!=null;});
      // escalaComum (mesma unidade): base ZERO, pra comparar magnitude entre séries.
      // Sem escala comum (unidades diferentes na mesma caixa): cada série usa o
      // próprio MIN..MAX, senão uma série quase estável (seguidores 13.642→13.725)
      // vira uma reta grudada no topo e parece defeito, escondendo a variação real.
      var max=escalaComum?maxComum:(Math.max.apply(null,ok.concat([0]))||1);
      var min=escalaComum?0:Math.min.apply(null,ok.concat([max]));
      var amp=(max-min)||1;
      var d='', started=false;
      vals.forEach(function(v,i){
        if(v==null) return;
        var x=padL+((new Date(pts[i].data+'T12:00:00').getTime()-t0)/span)*plotW;
        var frac=escalaComum?(v/max):((v-min)/amp);
        var y=padT+plotH-(0.08+frac*0.84)*plotH;   // 8% de folga em cima e embaixo
        d+=(started?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' '; started=true;
      });
      return '<path d="'+d.trim()+'" fill="none" stroke="'+s.cor+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
    }).join('');
    // grade horizontal discreta
    var grade=[0,.25,.5,.75,1].map(function(f){ var y=padT+plotH*f; return '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#EEF0F3" stroke-width="1"/>'; }).join('');
    var dBR=function(s){ var p=String(s).slice(0,10).split('-'); return p[2]+'/'+p[1]; };
    var eixo='<text x="'+padL+'" y="'+(H-7)+'" font-size="10" fill="#9aa0aa">'+dBR(pts[0].data)+'</text>'+
      '<text x="'+(W-padR)+'" y="'+(H-7)+'" font-size="10" fill="#9aa0aa" text-anchor="end">'+dBR(pts[pts.length-1].data)+'</text>';
    // Legenda: séries de FLUXO (gasto/contatos por dia) mostram o TOTAL do período;
    // séries de ESTADO (seguidores, alcance, engajamento) mostram o valor ATUAL.
    var leg=usadas.map(function(s){
      var v=null;
      if(s.somar){
        var t=0, achou=false;
        pts.forEach(function(p){ if(p[s.campo]!=null){ t+=Number(p[s.campo]); achou=true; } });
        if(achou) v=t;
      } else {
        for(var i=pts.length-1;i>=0;i--){ if(pts[i][s.campo]!=null){ v=Number(pts[i][s.campo]); break; } }
      }
      return '<span class="lg-i"><span class="lg-d" style="background:'+s.cor+'"></span>'+esc(s.nome)+
        (v!=null?' <b class="num">'+(s.fmt?s.fmt(v):fInt(v))+'</b>':'')+'</span>';
    }).join('');
    return '<div class="graf"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:'+H+'px">'+
      grade+paths+eixo+'</svg><div class="lg">'+leg+'</div></div>';
  }

  // PIZZA (donut SVG) — itens=[{label,valor}], cores=mapa label→hex. Legenda com %.
  function pizza(itens, cores){
    itens=(itens||[]).filter(function(x){return x.valor>0;});
    if(!itens.length)return '';
    var tot=itens.reduce(function(s,x){return s+x.valor;},0)||1;
    var r=54, cx=64, cy=64, C=2*Math.PI*r, off=0;
    var segs=itens.map(function(x){
      var frac=x.valor/tot, dash=frac*C, cor=(cores&&cores[x.label])||'#9aa0aa';
      var el='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+cor+'" stroke-width="20" '+
        'stroke-dasharray="'+dash.toFixed(2)+' '+(C-dash).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
      off+=dash; return el;
    }).join('');
    var leg=itens.map(function(x){var pct=Math.round(x.valor/tot*100),cor=(cores&&cores[x.label])||'#9aa0aa';
      return '<div class="pl"><span class="dot" style="background:'+cor+'"></span><span class="pn">'+esc(x.label)+'</span><span class="pp">'+pct+'%</span></div>';}).join('');
    return '<div class="pie"><svg viewBox="0 0 128 128" width="128" height="128">'+segs+'</svg><div class="plg">'+leg+'</div></div>';
  }

  var IC_IG='<span class="ic" style="background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff" stroke="none"/></svg></span>';
  var IC_G='<span class="ic" style="background:#fff;border:1px solid #eee"><svg width="15" height="15" viewBox="0 0 48 48"><path fill="#4285F4" d="M45 24c0-1.6-.1-2.8-.4-4H24v7.6h12c-.2 2-1.6 5-4.6 7l7 5.4C42.8 36.6 45 31 45 24z"/><path fill="#34A853" d="M24 46c6.2 0 11.4-2 15.2-5.6l-7-5.4c-2 1.4-4.6 2.2-8.2 2.2-6.3 0-11.6-4.2-13.5-10l-7.2 5.6C7 39.8 14.8 46 24 46z"/><path fill="#FBBC05" d="M10.5 27.2c-.5-1.4-.8-3-.8-4.2s.3-2.8.8-4.2l-7.2-5.6C1.8 16.2 1 20 1 24s.8 7.8 2.3 10.8l7.2-5.6z"/><path fill="#EA4335" d="M24 9.8c3.4 0 5.8 1.4 7.2 2.6l6.2-6C35.4 3 30.2 1 24 1 14.8 1 7 7.2 3.3 15.2l7.2 5.6C12.4 14 17.7 9.8 24 9.8z"/></svg></span>';
  var IC_M='<span class="ic" style="background:#fff;border:1px solid #eee"><svg width="15" height="15" viewBox="0 0 24 24" fill="#0081FB"><path d="M6.915 4.03c-1.968 0-3.683 1.28-4.871 3.113C.704 9.208 0 11.883 0 14.449c0 .706.07 1.369.21 1.973a6.624 6.624 0 0 0 .265.86 5.297 5.297 0 0 0 .371.761c.696 1.159 1.818 1.927 3.593 1.927 1.497 0 2.633-.671 3.965-2.444.76-1.012 1.144-1.626 2.663-4.32l.756-1.339.186-.325c.061.1.121.196.183.3l2.152 3.595c.724 1.21 1.665 2.556 2.47 3.314 1.046.987 1.992 1.22 3.06 1.22 1.075 0 1.876-.355 2.455-.843a3.743 3.743 0 0 0 .81-.973c.542-.939.861-2.127.861-3.745 0-2.72-.681-5.357-2.084-7.45-1.282-1.912-2.957-2.93-4.716-2.93-1.047 0-2.088.467-3.053 1.308-.652.57-1.257 1.29-1.82 2.05-.69-.875-1.335-1.547-1.958-2.056-1.182-.966-2.315-1.303-3.454-1.303zm10.16 2.053c1.147 0 2.188.758 2.992 1.999 1.132 1.748 1.647 4.195 1.647 6.4 0 1.548-.368 2.9-1.839 2.9-.58 0-1.027-.23-1.664-1.004-.496-.601-1.343-1.878-2.832-4.358l-.617-1.028a44.907 44.907 0 0 0-1.255-1.98c.07-.109.141-.224.211-.327 1.12-1.667 2.118-2.602 3.16-2.602zm-10.201.553c1.267 0 2.474.813 3.376 1.815-.377.513-.758 1.09-1.156 1.716-.694 1.09-1.155 1.887-1.756 2.941-1.482 2.61-1.937 3.201-2.622 3.201-.657 0-1.049-.404-1.049-1.813 0-2.665.746-5.166 1.667-6.657.542-.878 1.238-1.204 1.6-1.204z"/></svg></span>';

  var curDe='', curAte='', per='mespassado', perDe='', perAte='', lastData=null, imprimirAposCarga=false;
  var filaBloco=Promise.resolve(); // serializa os salvamentos dos quadradinhos (2 cliques rápidos não podem se atropelar)
  function periodoParams(){
    var d=new Date(), iso=function(x){return x.toISOString().slice(0,10);};
    if(per==='estemes'){ curDe=iso(new Date(d.getFullYear(),d.getMonth(),1)); curAte=iso(d); }
    else if(per==='7d'||per==='15d'||per==='30d'){ var n=parseInt(per,10); curDe=iso(new Date(d.getTime()-(n-1)*86400000)); curAte=iso(d); }
    else if(per==='custom'&&perDe&&perAte){ curDe=perDe; curAte=perAte; }
    else { var f=new Date(d.getFullYear(),d.getMonth(),0), i=new Date(d.getFullYear(),d.getMonth()-1,1); curDe=iso(i); curAte=iso(f); }
  }

  function carregar(){
    periodoParams();
    var q='?de='+curDe+'&ate='+curAte;
    var url, headers;
    if(modo==='admin'){ url=API+'/cliente-portal/admin/painel-cliente/'+adminCli+q; headers={'Authorization':'Bearer '+somTok}; }
    else { url=API+'/cliente-portal/painel-cliente'+q; headers={'Authorization':'Bearer '+cliTok}; }
    estado('<div class="spin"></div><b>Abrindo seu painel…</b>Puxando seus números do Instagram e das campanhas.');
    fetch(url,{headers:headers}).then(function(r){
      if(r.status===401||r.status===403){ if(modo==='cliente'){location.replace('cliente.html');return;} throw new Error('Sem acesso (403).'); }
      if(!r.ok) return r.json().catch(function(){return{};}).then(function(j){throw new Error(j.message||('HTTP '+r.status));});
      return r.json();
    }).then(function(d){ lastData=d; render(d); }).catch(function(e){ estado('<b>Não consegui abrir o painel.</b>'+esc(e.message||e)+'<br><br><span class="chip" onclick="location.reload()">Tentar de novo</span>'); });
  }

  // mapa das cidades (Leaflet) — círculos proporcionais aos cliques
  var mapaObj=null;
  function desenharMapa(pts){
    try{
      if(mapaObj){ mapaObj.remove(); mapaObj=null; }
      var el=document.getElementById('mapaCli'); if(!el) return;
      var mp=L.map('mapaCli',{zoomControl:true,attributionControl:false,scrollWheelZoom:false});
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:16}).addTo(mp);
      var max=0; pts.forEach(function(p){ if(p.cliques>max)max=p.cliques; }); max=max||1;
      var bounds=[];
      pts.forEach(function(p){
        var rad=8+Math.round(Math.sqrt(p.cliques/max)*22);
        L.circleMarker([p.lat,p.lng],{radius:rad,color:'#1a73e8',weight:2,fillColor:'#4285F4',fillOpacity:.45})
          .addTo(mp).bindTooltip('<b>'+esc(p.cidade)+'</b><br>'+fInt(p.cliques)+' cliques · '+fNum(p.conversoes)+' contatos',{direction:'top'});
        bounds.push([p.lat,p.lng]);
      });

  // Caixinha com as cidades agrupadas: fica no BODY (position:fixed) porque a
  // tabela vive dentro do .tw, que recorta qualquer popover absoluto.
  function ligarListaCidades(){
    var cx=document.getElementById('cidlistaBox');
    if(!cx){ cx=document.createElement('div'); cx.id='cidlistaBox'; cx.className='cidlista'; document.body.appendChild(cx); }
    var dentro=false, alvo=null;
    function abrir(td){
      var html=LISTAS[td.getAttribute('data-lista')]; if(!html) return;
      cx.innerHTML=html; cx.classList.add('on');
      var r=td.getBoundingClientRect(), lg=Math.min(340, innerWidth-24);
      cx.style.width=lg+'px';
      cx.style.left=Math.max(12, Math.min(r.left, innerWidth-lg-12))+'px';
      var alt=cx.offsetHeight, abaixo=innerHeight-r.bottom;
      cx.style.top=(abaixo>alt+16 ? r.bottom+6 : Math.max(12, r.top-alt-6))+'px';
      alvo=td;
    }
    function fechar(){ if(!dentro){ cx.classList.remove('on'); alvo=null; } }
    document.addEventListener('mouseover', function(e){
      var td=e.target.closest && e.target.closest('td.temlista');
      if(td && td!==alvo) abrir(td);
    });
    document.addEventListener('mouseout', function(e){
      var td=e.target.closest && e.target.closest('td.temlista');
      if(td) setTimeout(fechar, 180);
    });
    cx.addEventListener('mouseenter', function(){ dentro=true; });
    cx.addEventListener('mouseleave', function(){ dentro=false; fechar(); });
    // celular: toque abre e o toque fora fecha
    document.addEventListener('click', function(e){
      var td=e.target.closest && e.target.closest('td.temlista');
      if(td){ if(alvo===td && cx.classList.contains('on')){ dentro=false; fechar(); } else abrir(td); return; }
      if(!e.target.closest || !e.target.closest('.cidlista')){ dentro=false; fechar(); }
    });
    addEventListener('scroll', function(){ if(alvo) abrir(alvo); }, {passive:true});
  }

      c.addEventListener('click',function(){
        var p=c.getAttribute('data-p');
        if(p==='custom'){ per='custom'; if(!perDe||!perAte){ perDe=curDe; perAte=curAte; } if(lastData)render(lastData); else carregar(); return; }
        per=p; carregar();
      });
    });
    // Relatório mensal: põe no mês passado e abre a impressão/PDF sozinho
    var bm=document.getElementById('btnMensal');
    if(bm) bm.addEventListener('click',function(){ per='mespassado'; imprimirAposCarga=true; carregar(); });
    // Voltar pra área do cliente (o painel não tinha saída — Dinho 07/08)
    var bv=document.getElementById('btnVoltarArea');
    if(bv) bv.addEventListener('click',function(){ location.href='cliente.html'; });
    if(imprimirAposCarga){ imprimirAposCarga=false; setTimeout(function(){ window.print(); },700); }
    // personalizado: aplicar o intervalo escolhido no calendário
    var apl=document.getElementById('perAplicar');
    if(apl) apl.addEventListener('click',function(){
      var de=(document.getElementById('perDe')||{}).value, ate=(document.getElementById('perAte')||{}).value;
      if(!de||!ate){ alert('Escolha as duas datas.'); return; }
      if(de>ate){ alert('A data inicial não pode ser depois da final.'); return; }
      perDe=de; perAte=ate; carregar();
    });
    // liga os quadradinhos "Cliente vê" (visão da equipe): salva no backend e atualiza o selo
    if(modo==='admin') Array.prototype.forEach.call(document.querySelectorAll('input[data-bk]'),function(chk){
      chk.addEventListener('change',function(){
        var key=chk.getAttribute('data-bk'), on=chk.checked; chk.disabled=true;
        filaBloco=filaBloco.then(function(){
          return fetch(API+'/cliente-portal/admin/painel-bloco/'+encodeURIComponent(adminCli),{method:'POST',headers:{'Authorization':'Bearer '+somTok,'Content-Type':'application/json'},body:JSON.stringify({bloco:key,on:on})})
            .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
            .then(function(res){ if(res&&Array.isArray(res.ocultos))oc=res.ocultos.slice();
              // caixinha (tile) atualiza só a si; bloco atualiza selo + esmaecido
              var w=chk.closest('.cxw')||chk.closest('.blk'); if(w)w.classList.toggle('off-eq',!on);
              var s=w?w.querySelector('.selo'):null;
              if(s){s.textContent=on?'VISÍVEL PRO CLIENTE':'OCULTO PRO CLIENTE';s.style.background=on?'#EAF3DE':'#FEE2E2';s.style.color=on?'#27500A':'#991B1B';}
            }).catch(function(){chk.checked=!on;}).then(function(){chk.disabled=false;});
        });
      });
    });
  }

  if(modo==='cliente'&&!cliTok){ location.replace('cliente.html'); return; }
  if(modo==='admin'&&!adminCli){ estado('<b>Falta o cliente.</b>Abra pela ficha do cliente no SOM.'); return; }
  carregar();
})();
</script>
</body>
</html>

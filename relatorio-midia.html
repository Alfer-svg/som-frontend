<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório de Mídia · SOM</title>
<link rel="icon" href="assets/favicon.png">
<style>
  :root{
    --ink:#1b1b1b; --ink2:#3b4048; --mut:#6c7480; --mut2:#9aa0aa;
    --line:#E7E2D6; --hair:#EEEAE0; --page:#EDEBE6; --paper:#FFFFFF;
    --red:#E8402E; --yellow:#F4B400; --green:#1E9E4F; --blue:#3B7DD8;
    --tile:#F6F5F2; --hl:#FCEBD8; --hl2:#FBF3E4;  /* destaque pêssego das células */
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--page);color:var(--ink);
    font-family:"Avenir Next","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;font-size:14px}
  b{font-weight:700}
  .num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

  /* toolbar (não sai no PDF) */
  .bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:11px 22px;background:rgba(237,235,230,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .bar img{height:22px;display:block}
  .bar .ctl{display:flex;align-items:center;gap:10px}
  .bar input[type=month]{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;font-weight:600;color:var(--ink2)}
  .btn{border:0;cursor:pointer;font:inherit;font-weight:700;font-size:13.5px;padding:10px 18px;border-radius:11px;background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:8px}
  .btn svg{width:16px;height:16px}
  .btn[disabled]{opacity:.5;cursor:default}
  .estado{max-width:560px;margin:80px auto;text-align:center;color:var(--mut)}
  .estado b{color:var(--ink);display:block;font-size:18px;margin-bottom:8px}
  .spin{width:34px;height:34px;border:3px solid var(--hair);border-top-color:var(--ink);border-radius:50%;margin:0 auto 18px;animation:g .9s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}

  /* documento: folhas A4 */
  .doc{max-width:820px;margin:0 auto;padding:0 20px 60px}
  .sheet{background:var(--paper);border:1px solid var(--line);border-radius:3px;
    box-shadow:0 1px 2px rgba(20,18,15,.03),0 24px 60px -34px rgba(20,18,15,.25);
    margin-top:22px;position:relative;overflow:hidden;padding:44px 48px 40px}

  /* cabeçalho por página */
  .phead{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--hair);padding-bottom:12px;margin-bottom:26px}
  .phead .t b{font-size:13px;font-weight:800}
  .phead .t span{display:block;font-size:10.5px;color:var(--mut2);margin-top:2px;letter-spacing:.02em}
  .phead img{height:20px;opacity:.92}

  /* seção */
  .schead{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .schead .ic{width:26px;height:26px;flex:none;border-radius:6px;display:flex;align-items:center;justify-content:center}
  .schead h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0}

  /* tiles de KPI */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
  .tile{background:var(--tile);border-radius:11px;padding:15px 16px}
  .tile span{display:block;font-size:11px;font-weight:600;color:var(--mut);margin-bottom:7px;line-height:1.3}
  .tile b{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1}

  /* narrativa */
  .narr{font-size:13.5px;line-height:1.7;color:var(--ink2);margin:0 0 8px;max-width:64ch}
  .narr b{color:var(--ink);font-weight:700}
  .narr+.narr{margin-top:10px}

  /* título de bloco */
  .blk{display:flex;align-items:center;gap:9px;margin:28px 0 14px}
  .blk .d{width:16px;height:16px;border-radius:4px;flex:none}
  .blk h3{font-size:16px;font-weight:800;margin:0;letter-spacing:-.01em}

  /* tabela estilo relatório */
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
  th{text-align:left;font-size:10.5px;font-weight:700;color:var(--mut);background:#F3F1EC;padding:9px 11px;border-bottom:1px solid var(--hair)}
  th.n{text-align:right}
  td{padding:9px 11px;border-bottom:1px solid var(--hair);color:var(--ink2);vertical-align:middle}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  td.k{color:var(--ink);font-weight:600}
  td.hl{background:var(--hl)}
  td.hl2{background:var(--hl2)}
  .thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;background:#eee;flex:none;display:inline-block;vertical-align:middle;margin-right:9px}
  .adname{display:flex;align-items:center}
  .adname .tx{font-size:11.5px;color:var(--ink2);line-height:1.3;max-width:24ch;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

  /* gráfico de barras vertical (amarelo) */
  .chart{margin:4px 0 6px}
  .chart .cv{display:flex;align-items:flex-end;gap:10px;height:150px;border-left:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:0 6px 0 8px;position:relative}
  .chart .gl{position:absolute;left:0;right:0;border-top:1px dashed #EAE6DC;z-index:0}
  .chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;z-index:1;min-width:0}
  .chart .bar{width:60%;max-width:34px;background:var(--yellow);border-radius:3px 3px 0 0;min-height:2px}
  .chart .xl{margin-top:7px;display:flex;gap:10px;padding:0 6px 0 8px}
  .chart .xl span{flex:1;text-align:center;font-size:9.5px;color:var(--mut);line-height:1.2;word-break:break-word}
  .chart .yaxis{position:absolute;left:-2px;top:0;bottom:0;width:0}
  .legend{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:10px;font-size:11px;color:var(--mut)}
  .legend i{width:9px;height:9px;border-radius:2px;background:var(--yellow);display:inline-block}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:30px}
  .cap{font-size:11px;color:var(--mut2);line-height:1.5;margin-top:8px}

  /* capa */
  .cover{padding:0;min-height:0}
  .cover .top{display:flex;align-items:flex-start;justify-content:space-between;padding:40px 48px 0}
  .cover .social{display:flex;flex-direction:column;gap:9px}
  .cover .social i{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;font-style:normal}
  .cover .mid{padding:60px 48px 70px}
  .cover .tag{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-size:26px;letter-spacing:-.01em;padding:8px 16px;border-radius:6px;line-height:1.15}
  .cover .sub{font-size:20px;color:var(--ink2);margin:16px 0 0;font-weight:500}
  .cover .cli{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-size:24px;padding:7px 18px;border-radius:6px;margin-top:56px}
  .cover .mes{font-size:17px;color:var(--ink2);margin-top:14px}
  .cover .base{height:7px;display:flex;position:absolute;left:0;right:0;bottom:0}
  .cover .base i{flex:1}
  .partner{margin-top:40px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--hair);border-radius:10px;padding:8px 12px;font-size:11px;color:var(--mut);font-weight:600}
  .partner b{color:var(--ink)}

  @media (max-width:720px){
    .doc{padding:0 10px 40px} .sheet{padding:26px 20px}
    .tiles{grid-template-columns:repeat(2,1fr)} .two{grid-template-columns:1fr;gap:22px}
    .cover .top,.cover .mid{padding-left:24px;padding-right:24px}
  }
  @media print{
    @page{size:A4;margin:0}
    body{background:#fff}
    .bar{display:none} .doc{max-width:none;padding:0;margin:0}
    .sheet{box-shadow:none;border:0;border-radius:0;margin:0;padding:16mm 15mm;min-height:297mm;break-inside:avoid}
    .sheet+.sheet{page-break-before:always}
    .cover{padding:0}
    .cover .mid{padding:50px 20mm 80px}
  }
</style>
</head>
<body>

<div class="bar">
  <img src="assets/logo-horizontal.png" alt="Maracatu Digital">
  <div class="ctl">
    <input type="month" id="mes" title="Mês do relatório">
    <button class="btn" id="pdf" onclick="window.print()" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Baixar PDF
    </button>
  </div>
</div>

<div id="app"></div>

<script>
(function () {
  'use strict';
  var API = 'https://som-backend-production-01d8.up.railway.app/api';
  var LOGO_H = 'assets/logo-horizontal.png';
  var app = document.getElementById('app');
  var mesInput = document.getElementById('mes');
  var qs = new URLSearchParams(location.search);
  var clienteId = qs.get('cliente') || '';
  var token = localStorage.getItem('som_token') || '';

  function fInt(n){ return Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:0}); }
  function fNum(n){ var v=Number(n||0); return v.toLocaleString('pt-BR',{minimumFractionDigits:(v%1?2:0),maximumFractionDigits:2}); }
  function fMoney(n){ return 'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function fPct(n){ return n==null?'—':Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%'; }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function rico(s){ return esc(s).replace(/&lt;(\/?(?:b|em|i))&gt;/g,'<$1>'); }
  function ptData(iso){ var p=String(iso).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
  var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  function mesLabel(ini){ var p=ini.split('-'); return MESES[+p[1]-1]+' '+p[0]; }
  function estado(html){ app.innerHTML='<div class="estado">'+html+'</div>'; }

  // gráfico de barras vertical amarelo (estilo do PDF). itens=[{label,valor}]
  function grafico(itens){
    itens=(itens||[]).filter(function(x){return x.valor>0;});
    if(!itens.length) return '';
    var max=0; itens.forEach(function(x){ if(x.valor>max)max=x.valor; });
    // escala "redonda" pro topo
    var step=Math.pow(10,Math.floor(Math.log10(max||1)));
    var topo=Math.ceil(max/step)*step; if(topo<=max)topo+=step;
    var grid=''; for(var k=1;k<=4;k++){ grid+='<div class="gl" style="bottom:'+(k*25)+'%"></div>'; }
    var cols=itens.map(function(x){
      var h=Math.max(2,Math.round(x.valor/topo*100));
      return '<div class="col"><div class="bar" style="height:'+h+'%" title="'+esc(x.label)+': '+fNum(x.valor)+'"></div></div>';
    }).join('');
    var labs=itens.map(function(x){ return '<span>'+esc(x.label)+'</span>'; }).join('');
    return '<div class="chart"><div class="cv">'+grid+cols+'</div><div class="xl">'+labs+'</div>'+
      '<div class="legend"><i></i> Conversões</div></div>';
  }

  function phead(nome, ini, fim){
    return '<div class="phead"><div class="t"><b>Relatório '+esc(nome)+'</b>'+
      '<span>Período: '+ptData(ini)+' — '+ptData(fim)+'</span></div>'+
      '<img src="'+LOGO_H+'" alt="Maracatu Digital"></div>';
  }

  // ícones de canal
  var IC_G='<span class="ic" style="background:#fff;border:1px solid #eee"><svg width="15" height="15" viewBox="0 0 48 48"><path fill="#4285F4" d="M45 24c0-1.6-.1-2.8-.4-4H24v7.6h12c-.2 2-1.6 5-4.6 7l7 5.4C42.8 36.6 45 31 45 24z"/><path fill="#34A853" d="M24 46c6.2 0 11.4-2 15.2-5.6l-7-5.4c-2 1.4-4.6 2.2-8.2 2.2-6.3 0-11.6-4.2-13.5-10l-7.2 5.6C7 39.8 14.8 46 24 46z"/><path fill="#FBBC05" d="M10.5 27.2c-.5-1.4-.8-3-.8-4.2s.3-2.8.8-4.2l-7.2-5.6C1.8 16.2 1 20 1 24s.8 7.8 2.3 10.8l7.2-5.6z"/><path fill="#EA4335" d="M24 9.8c3.4 0 5.8 1.4 7.2 2.6l6.2-6C35.4 3 30.2 1 24 1 14.8 1 7 7.2 3.3 15.2l7.2 5.6C12.4 14 17.7 9.8 24 9.8z"/></svg></span>';
  var IC_M='<span class="ic" style="background:#0866FF"><svg width="16" height="11" viewBox="0 0 32 20"><path d="M2 10c0-4.4 2.6-8 6-8 5.5 0 10.5 16 16 16 3.4 0 6-3.6 6-8s-2.6-8-6-8c-5.5 0-10.5 16-16 16-3.4 0-6-3.6-6-8z" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></svg></span>';

  function tiles(arr){
    return '<div class="tiles">'+arr.map(function(t){
      return '<div class="tile"><span>'+esc(t[0])+'</span><b class="num">'+t[1]+'</b></div>';
    }).join('')+'</div>';
  }

  function render(d){
    document.title='Relatório de Mídia · '+d.cliente.nome+' — '+d.periodoLabel;
    var n=d.narrativa||{}, g=d.google, m=d.meta, t=d.totais;
    var nome=d.cliente.nome, ini=d.ini, fim=d.fim;
    var html='<div class="doc">';

    // ═══ CAPA ═══
    html+='<section class="sheet cover">'+
      '<div class="top">'+
        '<div class="social">'+
          '<i style="background:#1877F2">f</i><i style="background:#E4405F">◎</i>'+
          '<i style="background:#0A66C2">in</i><i style="background:#FF0000">▶</i><i style="background:#000">♪</i>'+
        '</div>'+
        '<img src="'+LOGO_H+'" alt="Maracatu Digital" style="height:30px">'+
      '</div>'+
      '<div class="mid">'+
        '<span class="tag">CAMPANHAS DE<br>MARKETING DIGITAL</span>'+
        '<div class="sub">Gestão de Tráfego Pago</div>'+
        '<div><span class="cli">'+esc(nome)+'</span></div>'+
        '<div class="mes">'+esc(d.periodoLabel.charAt(0).toUpperCase()+d.periodoLabel.slice(1))+'</div>'+
        (g?'<div class="partner"><svg width="14" height="14" viewBox="0 0 48 48"><path fill="#4285F4" d="M45 24c0-1.6-.1-2.8-.4-4H24v7.6h12c-.2 2-1.6 5-4.6 7l7 5.4C42.8 36.6 45 31 45 24z"/><path fill="#34A853" d="M24 46c6.2 0 11.4-2 15.2-5.6l-7-5.4c-2 1.4-4.6 2.2-8.2 2.2-6.3 0-11.6-4.2-13.5-10l-7.2 5.6C7 39.8 14.8 46 24 46z"/><path fill="#FBBC05" d="M10.5 27.2c-.5-1.4-.8-3-.8-4.2s.3-2.8.8-4.2l-7.2-5.6C1.8 16.2 1 20 1 24s.8 7.8 2.3 10.8l7.2-5.6z"/><path fill="#EA4335" d="M24 9.8c3.4 0 5.8 1.4 7.2 2.6l6.2-6C35.4 3 30.2 1 24 1 14.8 1 7 7.2 3.3 15.2l7.2 5.6C12.4 14 17.7 9.8 24 9.8z"/></svg> <b>Google</b> Partner</div>':'')+
      '</div>'+
      '<div class="base"><i style="background:var(--red)"></i><i style="background:var(--yellow)"></i><i style="background:var(--green)"></i><i style="background:var(--blue)"></i></div>'+
      '</section>';

    // ═══ GOOGLE ADS ═══
    if(g){
      var gr=g.resumo;
      var narrG=n.narrGoogle||('As campanhas do Google Ads durante o período de '+ptData(ini)+' a '+ptData(fim)+' originaram '+fInt(gr.cliques)+' cliques (visitas ao site) e '+fInt(gr.impressoes)+' impressões, com um CTR de '+fPct(gr.ctr)+'. Foi investido '+fMoney(gr.gasto)+', com custo por clique de '+fMoney(gr.cpcMedio)+'. As campanhas originaram um total de <b>'+fNum(gr.leads)+' conversões</b>, a '+fMoney(gr.custoLead)+' cada.');
      html+='<section class="sheet">'+phead(nome,ini,fim)+
        '<div class="schead">'+IC_G+'<h2>Google Ads</h2></div>'+
        tiles([
          ['Cliques',fInt(gr.cliques)],['Impressões',fInt(gr.impressoes)],['Custo por clique',fMoney(gr.cpcMedio)],
          ['CTR',fPct(gr.ctr)],['Custo',fMoney(gr.gasto)],['Conversões',fNum(gr.leads)],
          ['Custo/Conversão',gr.custoLead!=null?fMoney(gr.custoLead):'—']
        ])+
        '<p class="narr">'+rico(narrG)+'</p>';
      // Palavras-chave
      var termos=(g.termos||[]).slice(0,8);
      if(termos.length){
        html+='<div class="blk"><span class="d" style="background:var(--blue)"></span><h3>Principais palavras-chave</h3></div>'+
          '<table><tr><th>Palavra-chave</th><th class="n">Cliques</th><th class="n">Impressões</th><th class="n">Conversões</th><th class="n">Custo</th></tr>'+
          termos.map(function(x){ return '<tr><td class="k">'+esc(x.termo)+'</td><td class="n hl">'+fInt(x.cliques)+'</td><td class="n">'+fInt(x.impressoes)+'</td><td class="n hl2">'+fNum(x.conversoes)+'</td><td class="n">'+fMoney(x.custo)+'</td></tr>'; }).join('')+'</table>';
      }
      html+='</section>';

      // Google pág 2: idade + gênero + cidades
      var demoG=g.demografia||{};
      var idadeG=(demoG.idade||[]).map(function(x){return {label:x.label,valor:(x.conversoes||x.cliques)};}).slice(0,7);
      var genG=(demoG.genero||[]).map(function(x){return {label:x.label,valor:(x.conversoes||x.cliques)};});
      var cidades=(g.cidades||[]).slice(0,8);
      if(idadeG.length||genG.length||cidades.length){
        html+='<section class="sheet">'+phead(nome,ini,fim)+
          '<div class="two">'+
            '<div><div class="blk"><span class="d" style="background:var(--blue)"></span><h3>Idade</h3></div>'+grafico(idadeG)+'</div>'+
            '<div><div class="blk"><span class="d" style="background:var(--blue)"></span><h3>Gênero</h3></div>'+grafico(genG)+'</div>'+
          '</div>';
        if(cidades.length){
          html+='<div class="blk" style="margin-top:30px"><span class="d" style="background:var(--blue)"></span><h3>Principais cidades</h3></div>'+
            '<table><tr><th>Cidade</th><th class="n">Cliques</th><th class="n">Impressões</th><th class="n">Custo/clique</th><th class="n">Custo</th><th class="n">Conversões</th></tr>'+
            cidades.map(function(c){ return '<tr><td class="k">'+esc(c.cidade)+'</td><td class="n hl">'+fInt(c.cliques)+'</td><td class="n">'+fInt(c.impressoes)+'</td><td class="n">'+(c.cpc!=null?fMoney(c.cpc):'—')+'</td><td class="n">'+fMoney(c.custo)+'</td><td class="n hl2">'+fNum(c.conversoes)+'</td></tr>'; }).join('')+'</table>';
        }
        html+='</section>';
      }
    }

    // ═══ FACEBOOK / META ADS ═══
    if(m){
      var mr=m.resumo;
      var narrM=n.narrMeta||('Os anúncios no Facebook e Instagram tiveram durante o período '+fInt(mr.cliques)+' cliques e '+fInt(mr.impressoes)+' impressões (vezes que o anúncio foi exibido). O CTR do período foi de '+fPct(mr.ctr)+'. No período analisado o investimento foi de '+fMoney(mr.gasto)+' e o custo por clique ficou em '+fMoney(mr.cpcMedio)+'. '+fInt(mr.alcance)+' pessoas receberam as impressões dos anúncios (alcance), com frequência de '+fNum(mr.frequencia)+'. <b>'+fInt(mr.conversas)+' conversas</b> no WhatsApp foram iniciadas através das campanhas.');
      html+='<section class="sheet">'+phead(nome,ini,fim)+
        '<div class="schead">'+IC_M+'<h2>Facebook Ads</h2></div>'+
        tiles([
          ['Cliques (todos)',fInt(mr.cliques)],['Impressões',fInt(mr.impressoes)],['CTR (todos)',fPct(mr.ctr)],
          ['Valor gasto',fMoney(mr.gasto)],['CPC (todos)',fMoney(mr.cpcMedio)],['Alcance',fInt(mr.alcance)],
          ['Conversas por mensagem iniciadas',fInt(mr.conversas)]
        ])+
        '<p class="narr">'+rico(narrM)+'</p></section>';

      // Meta pág 2: anúncios + idade
      var anuncios=(m.anuncios||[]).slice(0,6);
      var demoM=m.demografia||{};
      var idadeM=(demoM.idade||[]).slice(0,7);
      var genM=(demoM.genero||[]);
      if(anuncios.length||idadeM.length){
        html+='<section class="sheet">'+phead(nome,ini,fim);
        if(anuncios.length){
          html+='<div class="schead">'+IC_M+'<h2>Anúncios no Facebook</h2></div>'+
            '<table><tr><th>Anúncio</th><th class="n">Alcance</th><th class="n">Impressões</th><th class="n">Cliques</th><th class="n">CPC</th><th class="n">Conversas</th></tr>'+
            anuncios.map(function(a){
              var th=a.thumb?'<img class="thumb" src="'+esc(a.thumb)+'">':'<span class="thumb"></span>';
              return '<tr><td class="k"><span class="adname">'+th+'<span class="tx">'+esc(a.nome)+'</span></span></td>'+
                '<td class="n hl">'+fInt(a.alcance)+'</td><td class="n">'+fInt(a.impressoes)+'</td><td class="n">'+fInt(a.cliques)+'</td><td class="n">'+(a.cpc!=null?fMoney(a.cpc):'—')+'</td><td class="n hl2">'+fInt(a.conversas)+'</td></tr>';
            }).join('')+'</table>';
        }
        if(idadeM.length){
          html+='<div class="blk" style="margin-top:30px"><span class="d" style="background:#0866FF"></span><h3>Idade</h3></div>'+grafico(idadeM);
        }
        html+='</section>';
      }
      // Meta pág 3: gênero + plataformas
      var plat=(m.plataformas||[]).filter(function(p){return p.gasto>0||p.cliques>0;});
      if(genM.length||plat.length){
        html+='<section class="sheet">'+phead(nome,ini,fim);
        if(genM.length){ html+='<div class="blk"><span class="d" style="background:#0866FF"></span><h3>Gênero</h3></div>'+grafico(genM); }
        if(plat.length){
          html+='<div class="blk" style="margin-top:30px"><span class="d" style="background:#0866FF"></span><h3>Plataformas de exposição dos anúncios</h3></div>'+
            '<table><tr><th>Plataforma</th><th class="n">Cliques</th><th class="n">Alcance</th><th class="n">Impressões</th><th class="n">Valor gasto</th></tr>'+
            plat.map(function(p){ return '<tr><td class="k">'+esc(p.plataforma)+'</td><td class="n hl">'+fInt(p.cliques)+'</td><td class="n">'+fInt(p.alcance)+'</td><td class="n">'+fInt(p.impressoes)+'</td><td class="n">'+fMoney(p.gasto)+'</td></tr>'; }).join('')+'</table>';
        }
        html+='</section>';
      }
    }

    html+='</div>';
    app.innerHTML=html;
    document.getElementById('pdf').disabled=false;
  }

  function carregar(){
    var q=(curIni&&curFim)?('?ini='+curIni+'&fim='+curFim):'';
    document.getElementById('pdf').disabled=true;
    estado('<div class="spin"></div><b>Gerando o relatório…</b>Puxando Google Ads e Meta Ads e escrevendo a leitura do mês. Leva menos de um minuto.');
    fetch(API+'/relatorios/midia/'+encodeURIComponent(clienteId)+q,{headers:{Authorization:'Bearer '+token}})
    .then(function(r){ if(r.status===401)throw new Error('login'); if(!r.ok)return r.json().catch(function(){return{};}).then(function(j){throw new Error(j.message||('HTTP '+r.status));}); return r.json(); })
    .then(function(d){ if(!d.google&&!d.meta){ estado('<b>'+esc(d.cliente?d.cliente.nome:'Cliente')+' ainda não tem conta de anúncio vinculada.</b>Vincule o Customer ID do Google Ads e/ou a conta Meta na ficha do cliente e gere de novo.'); return; } render(d); })
    .catch(function(e){ if(e.message==='login')estado('<b>Sessão expirada.</b>Abra o <a href="index.html">SOM</a>, faça login e clique em Gerar relatório de novo.'); else estado('<b>Não consegui gerar o relatório.</b>'+esc(e.message||e)+'<br><br><button class="btn" onclick="location.reload()">Tentar de novo</button>'); });
  }

  var curIni='',curFim='';
  function ehData(s){ return /^\d{4}-\d{2}-\d{2}$/.test(s||''); }
  function mesInteiro(mes){ var y=+mes.split('-')[0],mo=+mes.split('-')[1]; curIni=mes+'-01'; curFim=new Date(Date.UTC(y,mo,0)).toISOString().slice(0,10); }
  (function initPeriodo(){
    var i=qs.get('ini'),f=qs.get('fim');
    if(ehData(i)&&ehData(f)){ curIni=i; curFim=f; mesInput.value=i.slice(0,7); return; }
    if(ehData(i)){ mesInteiro(i.slice(0,7)); mesInput.value=i.slice(0,7); return; }
    var d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1);
    mesInput.value=d.toISOString().slice(0,7); mesInteiro(mesInput.value);
  })();
  mesInput.addEventListener('change',function(){ mesInteiro(mesInput.value); carregar(); });
  if(qs.get('embed')){ var b=document.querySelector('.bar'); if(b)b.style.display='none'; }

  if(!clienteId){ estado('<b>Falta o cliente.</b>Abra esta página pelo botão <b>Gerar relatório</b> na ficha do cliente no SOM.'); return; }
  if(!token){ estado('<b>Você não está logado.</b>Abra o <a href="index.html">SOM</a>, faça login e clique em Gerar relatório de novo.'); return; }
  carregar();
})();
</script>
</body>
</html>
